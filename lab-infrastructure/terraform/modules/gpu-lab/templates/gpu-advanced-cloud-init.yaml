#cloud-config
# Advanced GPU Lab Cloud-Init Configuration (8x A100)
# For Lab 3.3: 8-GPU NVLink topology AI VMs

package_update: true
package_upgrade: true

packages:
  - docker.io
  - jq
  - curl
  - wget
  - git
  - htop
  - tmux
  - vim
  - unzip
  - awscli
  - net-tools
  - nvtop
  - pciutils
  - numactl

groups:
  - docker

users:
  - default

write_files:
  - path: /etc/sysctl.d/99-k0rdent-gpu-advanced.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
      vm.swappiness = 10
      # RDMA settings for NVLink
      net.core.rmem_max = 16777216
      net.core.wmem_max = 16777216
    permissions: '0644'

  - path: /opt/k0rdent/config/gpu-advanced-info.env
    content: |
      LAB_SESSION_ID=${lab_session_id}
      K0S_VERSION=${k0s_version}
      GPU_OPERATOR_VERSION=${gpu_operator_version}
      NVIDIA_DRIVER_VERSION=${nvidia_driver_version}
      CUDA_VERSION=${cuda_version}
      ARTIFACTS_BUCKET=${artifacts_bucket}
      IMAGES_BUCKET=${images_bucket}
      AWS_REGION=${region}
      INSTANCE_TYPE=${instance_type}
      USE_NVIDIA_AMI=${use_nvidia_ami}
    permissions: '0644'

  - path: /opt/k0rdent/scripts/setup-nvidia-drivers.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      source /opt/k0rdent/config/gpu-advanced-info.env

      echo "=== Setting up NVIDIA Drivers for A100 ==="

      if [ "$USE_NVIDIA_AMI" == "true" ]; then
        echo "Using NVIDIA Deep Learning AMI - drivers pre-installed"
        nvidia-smi
        return 0
      fi

      # Add NVIDIA package repository
      curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
      curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
        sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
        sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list

      sudo apt-get update
      sudo apt-get install -y nvidia-driver-$NVIDIA_DRIVER_VERSION nvidia-container-toolkit nvidia-fabricmanager

      # Enable Fabric Manager for NVSwitch
      sudo systemctl enable nvidia-fabricmanager
      sudo systemctl start nvidia-fabricmanager

      # Configure Docker runtime
      sudo nvidia-ctk runtime configure --runtime=docker
      sudo systemctl restart docker

      echo "=== NVIDIA drivers installed ==="
      nvidia-smi
      nvidia-smi topo -m

  - path: /opt/k0rdent/scripts/setup-k0s-advanced.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      source /opt/k0rdent/config/gpu-advanced-info.env

      echo "=== Installing k0s $K0S_VERSION (8-GPU Advanced) ==="

      curl -sSLf https://get.k0s.sh | sudo K0S_VERSION=$K0S_VERSION sh

      NODE_IP=$(hostname -I | awk '{print $1}')

      mkdir -p /etc/k0s
      cat > /etc/k0s/k0s.yaml <<EOF
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: k0rdent-gpu-advanced-lab
      spec:
        api:
          address: $NODE_IP
          sans:
            - $NODE_IP
            - localhost
            - 127.0.0.1
        network:
          provider: calico
          calico:
            mode: vxlan
        extensions:
          helm:
            repositories:
              - name: nvidia
                url: https://helm.ngc.nvidia.com/nvidia
            charts:
              - name: gpu-operator
                chartname: nvidia/gpu-operator
                namespace: gpu-operator
                version: "$GPU_OPERATOR_VERSION"
                values: |
                  driver:
                    enabled: false
                  toolkit:
                    enabled: true
                  devicePlugin:
                    enabled: true
                  dcgm:
                    enabled: true
                  dcgmExporter:
                    enabled: true
                  mig:
                    strategy: mixed
                  nfd:
                    enabled: true
      EOF

      sudo k0s install controller --config /etc/k0s/k0s.yaml --enable-worker
      sudo k0s start

      sleep 60

      mkdir -p ~/.kube /home/ubuntu/.kube
      sudo k0s kubeconfig admin > ~/.kube/config
      cp ~/.kube/config /home/ubuntu/.kube/config
      chmod 600 ~/.kube/config /home/ubuntu/.kube/config
      chown ubuntu:ubuntu /home/ubuntu/.kube/config

      curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      chmod +x kubectl
      sudo mv kubectl /usr/local/bin/

      until kubectl get nodes | grep -q "Ready"; do
        echo "Waiting for node..."
        sleep 10
      done

      echo "=== k0s installation complete ==="

  - path: /opt/k0rdent/scripts/setup-nvlink-topology.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      echo "=== Configuring NVLink Topology for 8-GPU ==="

      # Display NVLink topology
      echo "NVLink Topology:"
      nvidia-smi topo -m

      # Display NVSwitch status
      echo "NVSwitch Status:"
      nvidia-smi nvlink -s

      # Check GPUDirect RDMA
      echo "GPUDirect RDMA Status:"
      cat /proc/driver/nvidia/gpudirect_rdma/status 2>/dev/null || echo "GPUDirect RDMA not available"

      # Label node with NVLink info
      kubectl label nodes $(hostname) nvidia.com/nvlink=true --overwrite || true
      kubectl label nodes $(hostname) nvidia.com/gpu.count=8 --overwrite || true
      kubectl label nodes $(hostname) k0rdent.io/gpu-advanced=true --overwrite || true

      # Create GPU topology ConfigMap
      cat <<EOF | kubectl apply -f -
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gpu-topology
        namespace: gpu-operator
      data:
        topology.txt: |
      $(nvidia-smi topo -m)
      EOF

      echo "=== NVLink topology configured ==="

  - path: /opt/k0rdent/scripts/setup-mig-profiles.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      echo "=== Setting up MIG Profiles for A100 ==="

      # Note: A100 supports MIG (Multi-Instance GPU)
      # This creates sample MIG configurations for the lab

      # Check if MIG is supported
      if ! nvidia-smi -i 0 --query-gpu=mig.mode.current --format=csv,noheader | grep -q "Enabled"; then
        echo "MIG is not currently enabled. Showing available profiles..."

        # Show available MIG profiles
        nvidia-smi mig -lgip

        echo ""
        echo "To enable MIG mode (requires reboot):"
        echo "  sudo nvidia-smi -i <gpu-id> -mig 1"
        echo ""
        echo "Example MIG profiles for A100:"
        echo "  1g.5gb  - 1/7 of GPU (7 instances per GPU)"
        echo "  2g.10gb - 2/7 of GPU"
        echo "  3g.20gb - 3/7 of GPU"
        echo "  4g.20gb - 4/7 of GPU"
        echo "  7g.40gb - Full GPU"
      else
        echo "MIG mode is enabled"
        nvidia-smi mig -lgi
      fi

      # Create MIG configuration template
      cat > /opt/k0rdent/manifests/mig-config.yaml <<'EOF'
      # MIG Configuration for A100 GPUs
      # Apply with: kubectl apply -f mig-config.yaml

      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: mig-parted-config
        namespace: gpu-operator
      data:
        config.yaml: |
          version: v1
          mig-configs:
            # All GPUs in same configuration (for labs)
            all-1g.5gb:
              - devices: all
                mig-enabled: true
                mig-devices:
                  "1g.5gb": 7
            all-balanced:
              - devices: all
                mig-enabled: true
                mig-devices:
                  "3g.20gb": 1
                  "2g.10gb": 1
                  "1g.5gb": 2
            all-disabled:
              - devices: all
                mig-enabled: false
      EOF

      echo "MIG configuration template created at /opt/k0rdent/manifests/mig-config.yaml"

  - path: /opt/k0rdent/scripts/setup-multi-gpu-workloads.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      echo "=== Setting up Multi-GPU Workload Examples ==="

      # Create namespace for multi-GPU workloads
      kubectl create namespace multi-gpu-workloads || true

      # Create 8-GPU workload template
      cat > /opt/k0rdent/manifests/8gpu-training.yaml <<'EOF'
      apiVersion: v1
      kind: Pod
      metadata:
        name: nccl-test-8gpu
        namespace: multi-gpu-workloads
      spec:
        restartPolicy: Never
        containers:
          - name: nccl-test
            image: nvcr.io/nvidia/pytorch:24.01-py3
            command: ["/bin/bash", "-c"]
            args:
              - |
                # Run NCCL all-reduce test across 8 GPUs
                apt-get update && apt-get install -y git
                git clone https://github.com/NVIDIA/nccl-tests.git
                cd nccl-tests
                make
                ./build/all_reduce_perf -b 8 -e 128M -f 2 -g 8
            resources:
              limits:
                nvidia.com/gpu: 8
            env:
              - name: NCCL_DEBUG
                value: "INFO"
      EOF

      # Create distributed training template
      cat > /opt/k0rdent/manifests/distributed-training.yaml <<'EOF'
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: pytorch-ddp-example
        namespace: multi-gpu-workloads
      spec:
        parallelism: 1
        completions: 1
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: pytorch-ddp
                image: nvcr.io/nvidia/pytorch:24.01-py3
                command: ["/bin/bash", "-c"]
                args:
                  - |
                    python -c "
                    import torch
                    import torch.distributed as dist

                    print(f'CUDA available: {torch.cuda.is_available()}')
                    print(f'GPU count: {torch.cuda.device_count()}')

                    for i in range(torch.cuda.device_count()):
                        print(f'GPU {i}: {torch.cuda.get_device_name(i)}')
                        print(f'  Memory: {torch.cuda.get_device_properties(i).total_memory / 1e9:.1f} GB')
                    "
                resources:
                  limits:
                    nvidia.com/gpu: 8
      EOF

      echo "Multi-GPU workload templates created in /opt/k0rdent/manifests/"

  - path: /opt/k0rdent/scripts/init-advanced-gpu-lab.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      LOG_FILE="/var/log/k0rdent-gpu-advanced-init.log"
      exec > >(tee -a "$LOG_FILE") 2>&1

      echo "=========================================="
      echo "k0rdent Advanced GPU Lab (8x A100)"
      echo "Lab Session: ${lab_session_id}"
      echo "Started at: $(date)"
      echo "=========================================="

      cd /opt/k0rdent/scripts

      echo "[1/5] Setting up NVIDIA drivers..."
      ./setup-nvidia-drivers.sh

      echo "[2/5] Setting up k0s cluster..."
      ./setup-k0s-advanced.sh

      echo "[3/5] Configuring NVLink topology..."
      ./setup-nvlink-topology.sh

      echo "[4/5] Setting up MIG profiles..."
      ./setup-mig-profiles.sh

      echo "[5/5] Setting up multi-GPU workload examples..."
      ./setup-multi-gpu-workloads.sh

      echo "=========================================="
      echo "Advanced GPU Lab initialization complete!"
      echo "Finished at: $(date)"
      echo "=========================================="

      nvidia-smi
      nvidia-smi topo -m

      touch /opt/k0rdent/.init-complete

      source /opt/k0rdent/config/gpu-advanced-info.env
      aws s3 cp "$LOG_FILE" "s3://$ARTIFACTS_BUCKET/logs/$LAB_SESSION_ID/gpu-advanced-init-$(date +%Y%m%d-%H%M%S).log" || true

runcmd:
  - sysctl --system
  - modprobe br_netfilter || true
  - usermod -aG docker ubuntu
  - mkdir -p /opt/k0rdent/{config,scripts,manifests}
  - chown -R ubuntu:ubuntu /opt/k0rdent
  - mkfs.ext4 /dev/nvme1n1 || mkfs.ext4 /dev/xvdb || true
  - mkdir -p /var/lib/models
  - mount /dev/nvme1n1 /var/lib/models || mount /dev/xvdb /var/lib/models || true
  - echo '/dev/nvme1n1 /var/lib/models ext4 defaults 0 2' >> /etc/fstab || true
  - chown -R ubuntu:ubuntu /var/lib/models
  - nohup /opt/k0rdent/scripts/init-advanced-gpu-lab.sh > /var/log/k0rdent-gpu-advanced-init-bg.log 2>&1 &

final_message: |
  k0rdent Advanced GPU Lab - 8x A100 NVLink
  Lab Session: ${lab_session_id}
  Instance Type: ${instance_type}

  Cloud-init complete. Lab initialization running in background.
  Check progress: tail -f /var/log/k0rdent-gpu-advanced-init.log

  Once complete:
    nvidia-smi                    # Check 8 GPUs
    nvidia-smi topo -m            # View NVLink topology
    nvidia-smi nvlink -s          # NVSwitch status
    kubectl get nodes             # Verify cluster

  Multi-GPU workloads in /opt/k0rdent/manifests/
