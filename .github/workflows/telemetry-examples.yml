name: telemetry examples
on:
  pull_request:
    paths:
      - 'curriculum/examples/telemetry/**'
      - '.github/workflows/telemetry-examples.yml'
  push:
    branches: [main]
    paths:
      - 'curriculum/examples/telemetry/**'
      - '.github/workflows/telemetry-examples.yml'
permissions:
  contents: read
jobs:
  values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s curriculum/examples/telemetry/tests -v
