extra_css:
- assets/preview.css
extra_javascript:
- assets/mermaid.min.js
- assets/preview.js
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: course-diagram
      format: !!python/name:pymdownx.superfences.fence_code_format

site_url: https://mirantis-ps.github.io/k0rdent-ai-training/
