# The workflow stages tracked course files in build/course-docs before building.
site_name: k0rdent AI Training
site_description: A practical course for AI infrastructure engineers
docs_dir: build/course-docs
site_dir: build/course-site
use_directory_urls: true
theme:
  name: material
  font: false
  palette:
  - scheme: default
    primary: indigo
    accent: teal
    toggle:
      icon: material/weather-night
      name: Dark mode
  - scheme: slate
    primary: indigo
    accent: teal
    toggle:
      icon: material/weather-sunny
      name: Light mode
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.tracking
  - toc.follow
  - search.suggest
  - search.highlight
  - content.code.copy
plugins:
- search
nav:
- Start here:
  - Welcome: index.md
  - Course checklist: curriculum/README.md
  - Prerequisites: curriculum/overview/prerequisites.md
  - Repository quick start: repository.md
- Course:
