apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: nccl-allreduce-topo
  namespace: distributed-training
spec:
  slotsPerWorker: 1
  runPolicy:
    cleanPodPolicy: None
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          containers:
          - name: launcher
            image: nvcr.io/nvidia/pytorch:24.12-py3
            command:
            - bash
            - /opt/mpi/launch.sh
            args:
            - -np
            - '2'
            - -npernode
            - '1'
            - -bind-to
            - none
            - -map-by
            - slot
            - -x
            - NCCL_DEBUG=INFO
            - -x
            - LD_LIBRARY_PATH
            - bash
            - /opt/mpi/run.sh
            - python
            - -c
            - |
              import torch
              import torch.distributed as dist
              import os
              dist.init_process_group(backend='nccl')
              rank = dist.get_rank()
              local_rank = int(os.environ.get('LOCAL_RANK', rank % 8))
              torch.cuda.set_device(local_rank)
              # All-reduce benchmark using PyTorch
              for size_mb in [1, 8, 64, 256, 1024, 4096]:
                  tensor = torch.zeros(size_mb * 1024 * 1024 // 4, device=f'cuda:{local_rank}')
                  torch.cuda.synchronize()
                  start = torch.cuda.Event(enable_timing=True)
                  end = torch.cuda.Event(enable_timing=True)
                  # Warmup
                  for _ in range(5):
                      dist.all_reduce(tensor)
                  torch.cuda.synchronize()
                  start.record()
                  iters = 20
                  for _ in range(iters):
                      dist.all_reduce(tensor)
                  end.record()
                  torch.cuda.synchronize()
                  elapsed_ms = start.elapsed_time(end) / iters
                  size_bytes = size_mb * 1024 * 1024
                  algbw = size_bytes / (elapsed_ms / 1000) / 1e9
                  busbw = algbw * (2 * (dist.get_world_size() - 1) / dist.get_world_size())
                  if rank == 0:
                      print(f'Size: {size_mb:>5} MB | Time: {elapsed_ms:>8.2f} ms | AlgBW: {algbw:>8.2f} GB/s | BusBW: {busbw:>8.2f} GB/s')
              dist.destroy_process_group()
            volumeMounts:
            - name: mpi-adapters
              mountPath: /opt/mpi
              readOnly: true
          volumes:
          - name: mpi-adapters
            configMap:
              name: mpi-adapters
    Worker:
      replicas: 2
      template:
        spec:
          containers:
          - name: worker
            image: nvcr.io/nvidia/pytorch:24.12-py3
            command:
            - bash
            - /opt/mpi/worker-init.sh
            env:
            - name: NCCL_DEBUG
              value: INFO
            - name: NCCL_IB_DISABLE
              value: '1'
            - name: TRAINING_FRAMEWORK
              value: none
            resources:
              limits:
                nvidia.com/gpu: 1
              requests:
                nvidia.com/gpu: 1
            securityContext:
              capabilities:
                add:
                - IPC_LOCK
            volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: mpi-adapters
              mountPath: /opt/mpi
              readOnly: true
          volumes:
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi
          - name: mpi-adapters
            configMap:
              name: mpi-adapters
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          runtimeClassName: nvidia
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: training.k0rdent.io/accelerator-domain
                    operator: In
                    values:
                    - training-domain-a
        metadata:
          labels:
            training.k0rdent.io/job: nccl-allreduce-topo
