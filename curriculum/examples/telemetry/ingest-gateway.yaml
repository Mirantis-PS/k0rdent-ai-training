apiVersion: v1
kind: ConfigMap
metadata:
  name: kof-ingest-gateway
  namespace: kof
data:
  nginx.conf: |
    events {}
    http {
      access_log /dev/stdout;
      error_log /dev/stderr;
      server { listen 8080; location = /healthz { return 200 "ok\n"; } }
      server {
        listen 8443 ssl;
        ssl_certificate /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        ssl_client_certificate /tls/ca.crt;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 32m;
        location = /metrics {
          proxy_pass http://vminsert-cluster.kof.svc:8480/insert/0/prometheus/api/v1/write;
        }
        location = /logs/v1/logs {
          proxy_pass http://kof-storage-victoria-logs-cluster-vlinsert.kof.svc:9481/insert/opentelemetry/v1/logs;
        }
        location / { return 404; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kof-ingest-gateway
  namespace: kof
spec:
  replicas: 1
  selector:
    matchLabels: {app: kof-ingest-gateway}
  template:
    metadata:
      labels: {app: kof-ingest-gateway}
    spec:
      containers:
        - name: nginx
          image: nginx:1.28.0
          ports:
            - {name: https, containerPort: 8443}
            - {name: health, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: health}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: config
          configMap: {name: kof-ingest-gateway}
        - name: tls
          secret: {secretName: kof-ingest-server}
---
apiVersion: v1
kind: Service
metadata:
  name: kof-ingest-gateway
  namespace: kof
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector: {app: kof-ingest-gateway}
  ports:
    - {name: https, port: 443, targetPort: https}
