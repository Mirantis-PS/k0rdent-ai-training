apiVersion: v1
kind: ConfigMap
metadata:
  name: kof-query-proxy
  namespace: kof
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 8080;
        location = /healthz { return 200 "ok\n"; }
        location /prometheus/ {
          proxy_pass https://INGEST_HOST/read/;
          proxy_ssl_server_name on;
          proxy_ssl_name INGEST_HOST;
          proxy_ssl_verify on;
          proxy_ssl_trusted_certificate /tls/ca.crt;
          proxy_ssl_certificate /tls/tls.crt;
          proxy_ssl_certificate_key /tls/tls.key;
        }
        location / { return 404; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kof-query-proxy
  namespace: kof
spec:
  replicas: 1
  selector:
    matchLabels: {app: kof-query-proxy}
  template:
    metadata:
      labels: {app: kof-query-proxy}
    spec:
      containers:
        - name: nginx
          image: nginx:1.28.0
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: config
          configMap: {name: kof-query-proxy}
        - name: tls
          secret: {secretName: kof-ingest-client}
---
apiVersion: v1
kind: Service
metadata:
  name: kof-query-proxy
  namespace: kof
spec:
  selector: {app: kof-query-proxy}
  ports: [{name: http, port: 8080, targetPort: http}]
