apiVersion: v1
kind: ConfigMap
metadata:
  name: mpi-adapters
  namespace: distributed-training
data:
  worker-init.sh: |
    #!/bin/bash
    set -euo pipefail
    export DEBIAN_FRONTEND=noninteractive
    if ! command -v /usr/sbin/sshd >/dev/null; then
      apt-get update -qq
      apt-get install -y --no-install-recommends openssh-server
    fi
    if [[ ${TRAINING_FRAMEWORK:-none} == megatron ]]; then
      pip install --no-cache-dir --break-system-packages -e /workspace/Megatron-LM
    elif [[ ${TRAINING_FRAMEWORK:-none} == deepspeed ]]; then
      pip install --no-cache-dir --break-system-packages transformers==4.47.1 accelerate==1.2.1 deepspeed==0.16.2
    elif [[ ${TRAINING_FRAMEWORK:-none} == fsdp ]]; then
      pip install --no-cache-dir --break-system-packages transformers==4.47.1
    fi
    mkdir -p /var/run/sshd
    ssh-keygen -A
    cat > /etc/ssh/sshd_mpi.conf <<'CONFIG'
    Port 22
    PermitRootLogin prohibit-password
    PasswordAuthentication no
    PubkeyAuthentication yes
    StrictModes no
    AuthorizedKeysFile /root/.ssh/authorized_keys
    CONFIG
    exec /usr/sbin/sshd -D -e -f /etc/ssh/sshd_mpi.conf
  run.sh: |
    #!/bin/bash
    set -euo pipefail
    export RANK=${OMPI_COMM_WORLD_RANK:?MPI rank is required}
    export LOCAL_RANK=${OMPI_COMM_WORLD_LOCAL_RANK:?MPI local rank is required}
    export WORLD_SIZE=${OMPI_COMM_WORLD_SIZE:?MPI size is required}
    : "${MASTER_ADDR:?launcher must set rendezvous host}"
    export MASTER_PORT=${MASTER_PORT:-29500}
    exec "$@"
  launch.sh: |
    #!/bin/bash
    set -euo pipefail
    command -v ssh >/dev/null || { apt-get update -qq; apt-get install -y --no-install-recommends openssh-client; }
    SSH_OPTIONS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5)
    SSHOPTS="${SSH_OPTIONS[*]}"
    while read -r host rest; do
      [[ -n $host && $host != \#* ]] || continue
      ready=false
      for ((attempt=1; attempt<=120; attempt++)); do
        if ssh -n "${SSH_OPTIONS[@]}" "$host" true 2>/dev/null; then ready=true; break; fi
        sleep 5
      done
      $ready || { echo "Worker SSH did not become ready: $host" >&2; exit 1; }
    done < /etc/mpi/hostfile
    MASTER_ADDR=$(awk 'NF && $1 !~ /^#/ {print $1; exit}' /etc/mpi/hostfile)
    export MASTER_ADDR MASTER_PORT=29500
    # Operator mounts SSH keys and the hostfile. These options apply to ephemeral lab workers.
    exec mpirun --allow-run-as-root --hostfile /etc/mpi/hostfile \
      --mca plm_rsh_args "$SSHOPTS" -x MASTER_ADDR -x MASTER_PORT -x PATH -x LD_LIBRARY_PATH -x NCCL_IB_DISABLE=1 "$@"
