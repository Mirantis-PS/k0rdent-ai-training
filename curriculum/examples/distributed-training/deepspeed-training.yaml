apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: deepspeed-llm-training
  namespace: distributed-training
spec:
  slotsPerWorker: 8
  runPolicy:
    cleanPodPolicy: Running
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          containers:
          - name: launcher
            image: nvcr.io/nvidia/pytorch:24.12-py3
            command:
            - bash
            - /opt/mpi/launch.sh
            volumeMounts:
            - name: config
              mountPath: /config
            - name: train-script
              mountPath: /scripts
            - name: checkpoints
              mountPath: /checkpoints
            - name: mpi-adapters
              mountPath: /opt/mpi
              readOnly: true
            args:
            - -np
            - '16'
            - -npernode
            - '8'
            - -bind-to
            - none
            - -map-by
            - slot
            - -x
            - NCCL_DEBUG=WARN
            - -x
            - LD_LIBRARY_PATH
            - bash
            - /opt/mpi/run.sh
            - python
            - /scripts/train.py
            - --deepspeed
            - --deepspeed_config=/config/ds_config.json
          volumes:
          - name: config
            configMap:
              name: deepspeed-config
          - name: train-script
            configMap:
              name: deepspeed-train-script
          - name: checkpoints
            persistentVolumeClaim:
              claimName: training-checkpoints
          - name: mpi-adapters
            configMap:
              name: mpi-adapters
    Worker:
      replicas: 2
      template:
        spec:
          containers:
          - name: worker
            image: nvcr.io/nvidia/pytorch:24.12-py3
            command:
            - bash
            - /opt/mpi/worker-init.sh
            env:
            - name: NCCL_DEBUG
              value: WARN
            - name: NCCL_IB_DISABLE
              value: '1'
            - name: TRAINING_FRAMEWORK
              value: deepspeed
            resources:
              limits:
                nvidia.com/gpu: 8
              requests:
                nvidia.com/gpu: 8
            securityContext:
              capabilities:
                add:
                - IPC_LOCK
            volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: config
              mountPath: /config
            - name: train-script
              mountPath: /scripts
            - name: checkpoints
              mountPath: /checkpoints
            - name: mpi-adapters
              mountPath: /opt/mpi
              readOnly: true
          volumes:
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 256Gi
          - name: config
            configMap:
              name: deepspeed-config
          - name: train-script
            configMap:
              name: deepspeed-train-script
          - name: checkpoints
            persistentVolumeClaim:
              claimName: training-checkpoints
          - name: mpi-adapters
            configMap:
              name: mpi-adapters
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          runtimeClassName: nvidia
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    training.k0rdent.io/job: deepspeed-llm-training
                topologyKey: kubernetes.io/hostname
        metadata:
          labels:
            training.k0rdent.io/job: deepspeed-llm-training
